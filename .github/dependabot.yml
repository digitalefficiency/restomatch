version: 2

updates:
  # Application/library dependencies. Dependabot detects the pnpm workspace from
  # the root pnpm-lock.yaml and proposes updates across all workspace packages.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    groups:
      # Collapse low-risk minor/patch bumps into a single PR to cut review noise.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Pilot freeze (ציקטי, 8.11.2026): NO major version bumps for ANY npm
      # dependency — the wildcard covers every workspace package, including the
      # apps/mobile tree (it is in the root pnpm workspace, no separate lockfile).
      # Majors need code changes and are coordinated by hand. `ignore` applies to
      # version updates only: Dependabot SECURITY updates still come through.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # GitHub Actions — keep the SHA-pinned actions current (Dependabot updates both
  # the pinned SHA and the trailing version comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
