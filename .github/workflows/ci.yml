name: CI

# The enforcement gate. Verified to pass on a clean checkout: the schema is
# bootstrapped with `db migrate` (applies EVERY journal entry, 0000..0026 and
# on), RLS is provisioned and checked, then the suite runs serially against a
# Postgres 16 + pgvector service container.
#
# Jobs (plan v2, Wave 0 / T0):
#   test          - typecheck (non-web) + serial vitest for every package except
#                   the worker. REDIS_URL is deliberately NOT set here: a repo-wide
#                   value would flip apps/web/lib/rateLimit.ts and packages/queue
#                   to real Redis inside the API suites.
#   worker-tests  - apps/worker suite with a job-scoped Redis service.
#   web           - `next build` then `tsc --noEmit` for apps/web (the tsconfig
#                   includes .next/types, which is why the build must run first).
#                   The typecheck step is continue-on-error during a soak period:
#                   next.config.ts documents an intermittent tRPC AppRouter
#                   inference flake. Promote to blocking once measured clean.
#   e2e           - Playwright (magic-link flow) against `next dev`. continue-on-
#                   error until the spec is refreshed for password/2FA auth and
#                   moved to a production-build server (W2, Session 7).
#   audit / dependency-review - supply-chain gates (Epic D3).
#
# Supply-chain hardening (Epic D3): actions are pinned to commit SHAs, the
# GITHUB_TOKEN defaults to read-only, checkout does not persist credentials, and
# a weekly schedule re-runs the gate to surface dependency drift.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift/advisory sweep, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

# Least-privilege default for every job; jobs opt into more as needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restomatch_test
          # trust auth so the test-created `restomatch_app` non-owner role can
          # log in over TCP without a scram handshake (rls.attack.test.ts).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/restomatch_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/restomatch_test
      # No REDIS_URL on purpose -> rate limiting falls back to the in-memory store.

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap test DB (extensions + every journal migration)
        run: pnpm --filter @restomatch/db migrate

      - name: Provision RLS (0002 core tenant + 0003 audit + restomatch_app role)
        run: pnpm --filter @restomatch/db provision-rls

      - name: RLS completeness gate (every restaurant_id table has RLS enabled)
        run: pnpm --filter @restomatch/db check-rls

      - name: Typecheck (all packages except web)
        run: pnpm turbo run typecheck --concurrency=1 --filter='!@restomatch/web'

      - name: Test (serial; DB-backed suites + RLS attack + the leak canary)
        run: pnpm turbo run test --concurrency=1 --filter='!@restomatch/worker'

  worker-tests:
    name: worker tests (job-scoped Redis)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restomatch_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/restomatch_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/restomatch_test
      # Scoped to this job only (see header).
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap test DB
        run: pnpm --filter @restomatch/db migrate

      - name: Worker suite
        run: pnpm --filter @restomatch/worker test

  web:
    name: web build + typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restomatch_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `next build` imports apps/web/lib/{db,authDb}.ts at page-data collection;
      # both resolve a connection string at import (no connection is opened),
      # and resolveWebDbUrl() is fail-closed without DATABASE_URL_APP. Point every
      # URL at the (migrated) CI database. Throwaway secrets only.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/restomatch_test
      DATABASE_URL_APP: postgres://postgres:postgres@localhost:5432/restomatch_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/restomatch_test
      AUTH_SECRET: ci-only-secret-not-production-0123456789
      AUTH_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap DB (static pages may query plans at build time)
        run: pnpm --filter @restomatch/db migrate

      - name: next build
        run: pnpm --filter @restomatch/web build

      # Soak period: measure the documented tRPC-type inference flake before
      # this becomes a blocking gate (then drop typescript.ignoreBuildErrors in
      # next.config.ts).
      - name: tsc --noEmit (apps/web; non-blocking during soak)
        continue-on-error: true
        run: pnpm --filter @restomatch/web typecheck

  e2e:
    name: e2e (playwright, non-blocking during soak)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restomatch_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/restomatch_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/restomatch_test
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap test DB
        run: pnpm --filter @restomatch/db migrate

      - name: Install Playwright browser
        run: pnpm --filter @restomatch/web exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm --filter @restomatch/web test:e2e

  audit:
    name: pnpm audit (prod, high+)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on any high/critical advisory in the production dependency tree.
      # Pre-existing, itemized exceptions live in package.json
      # (pnpm.auditConfig.ignoreGhsas) and are documented + dated in
      # docs/SECURITY-AUDIT-EXCEPTIONS.md. New high/critical advisories fail here.
      - name: Audit production dependencies (high/critical)
        run: pnpm audit --prod --audit-level=high

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    # PR-only: diffs the PR's dependency manifest against the base branch and
    # blocks newly-introduced vulnerable dependencies before they merge.
    #
    # Currently non-blocking: the action fails with "Dependency review is not
    # supported on this repository" until Dependency graph is enabled in
    # Settings -> Code security (owner action, plan v2 Wave 0). Flip
    # continue-on-error off once it is enabled.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
