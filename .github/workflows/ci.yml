name: CI

# The enforcement gate. Verified to pass on a clean checkout: the schema is
# bootstrapped with `db migrate` (no vitest globalSetup exists — DB-backed tests
# assume the schema is already present), then the suite runs serially against a
# Postgres 16 + pgvector service container.
#
# Scope note: web typecheck/lint and the Next build are intentionally NOT in this
# v1 gate — apps/web's tsconfig includes `.next/types/**`, so `tsc --noEmit`
# needs a prior `next build`. Adding a web build+lint+typecheck job is a tracked
# follow-up (see AGENTS.md "Test / CI facts"); do not silently disable it.
#
# Supply-chain hardening (Epic D3): actions are pinned to commit SHAs, the
# GITHUB_TOKEN defaults to read-only, checkout does not persist credentials, and
# a weekly schedule re-runs the gate to surface dependency drift.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift/advisory sweep, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

# Least-privilege default for every job; jobs opt into more as needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restomatch_test
          # trust auth so the test-created `restomatch_app` non-owner role can
          # log in over TCP without a scram handshake (rls.attack.test.ts).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # migrate reads DATABASE_URL; the DB-backed tests read DATABASE_URL_TEST.
      # Both must point at the SAME database so tests see the migrated schema.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/restomatch_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/restomatch_test
      # No REDIS_URL on purpose → rate limiting falls back to the in-memory store.

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap test DB (extensions + migrations 0000..0008)
        run: pnpm --filter @restomatch/db migrate

      - name: Typecheck (all packages except web)
        run: pnpm turbo run typecheck --concurrency=1 --filter='!@restomatch/web'

      - name: Test (serial; DB-backed suites + RLS attack + the leak canary)
        run: pnpm turbo run test --concurrency=1

  audit:
    name: pnpm audit (prod, high+)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on any high/critical advisory in the production dependency tree.
      # Pre-existing, itemized exceptions live in package.json
      # (pnpm.auditConfig.ignoreGhsas) and are documented + dated in
      # docs/SECURITY-AUDIT-EXCEPTIONS.md. New high/critical advisories fail here.
      - name: Audit production dependencies (high/critical)
        run: pnpm audit --prod --audit-level=high

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    # PR-only: diffs the PR's dependency manifest against the base branch and
    # blocks newly-introduced vulnerable dependencies before they merge.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
