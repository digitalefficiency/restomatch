name: Secret scan

# CI secret scanning with gitleaks. Catches credentials committed in a PR diff
# (and the full history on push to main) before they spread.
#
# Defense-in-depth note (push protection): this CI scan is the *second* line of
# defense. Enable GitHub-native Secret Scanning + Push Protection in the repo
# settings (Settings → Code security and analysis) so that pushes containing a
# detected secret are blocked at the server BEFORE they ever land — CI then
# backstops custom/low-signal patterns the native scanner misses. Config for the
# allowlist lives in `.gitleaks.toml`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so a push scan can inspect every new commit on the ref.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only when the repo lives under a GitHub Organization account
          # (free for personal accounts / public repos). Add the secret then
          # uncomment:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
