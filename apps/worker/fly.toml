# RestoMatch async worker — BullMQ consumers + cron (OCR, 3-way matching, the ₪
# leak figure, cadence alerts, outbox dispatch). This process is where the core
# value runs; without it, invoice uploads succeed but nothing is ever processed.
#
# The build context MUST be the repo root (the worker pulls many workspace:*
# packages). Deploy from the repo root with:
#
#   fly deploy --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile .
#
# First-time setup:  fly launch --no-deploy --copy-config --name restomatch-worker
# Secrets (see docs/DEPLOY_CUTOVER.md for the full list):
#   fly secrets set DATABASE_URL=... REDIS_URL=... ANTHROPIC_API_KEY=... \
#                   RESEND_API_KEY=... EMAIL_FROM=... APP_URL=...

app = "restomatch-worker"
# Colocate with the database. Today Supabase is ap-southeast-2 (Sydney) → "syd".
# After the EU move (docs/HANDOFF.md §4) switch to "fra" (Frankfurt).
primary_region = "syd"

# Graceful shutdown: the worker traps SIGTERM, stops taking jobs, lets in-flight
# jobs finish (BullMQ Worker.close), drains its Postgres pool, then exits.
# A job cut off anyway is "stalled" and re-run by BullMQ — nothing is lost.
kill_signal = "SIGTERM"
kill_timeout = "120s"

[deploy]
  # One machine: start the new one, wait for /health, then stop the old one.
  strategy = "rolling"

[build]
  dockerfile = "apps/worker/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

# Internal-only health probe. The worker is NOT a public web service — it only
# serves /health for the platform liveness check (apps/worker/src/health.ts).
# A failed probe restarts the machine instead of letting it run dark.
[checks]
  [checks.health]
    type = "http"
    port = 8080
    method = "get"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"

# Restart a crashed process automatically (in addition to the health check).
[[restart]]
  policy = "always"
  retries = 10

# Exactly ONE worker: there is no [http_service], so Fly never auto-stops or
# auto-starts machines; keep the count at 1 with `fly scale count 1`. (BullMQ
# makes >1 safe if you ever need throughput; cron schedulers are idempotent.)
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  cpus = 1
