<title>RestoMatch · תפריט צד</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
.rm { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* Layout: the RestoMatch app shown as one framed window on a soft green-grey page. The side menu sits at the
   inline-start edge (right in Hebrew). One grid: icon axis 32 px from that edge, label axis 52, badge axis 227. */
@font-face { font-family: 'Heebo Fallback'; src: local('Arial'); ascent-override: 104.9%; descent-override: 42.14%; line-gap-override: 0%; }
:root {
  color-scheme: light;
  /* apps/web/app/globals.css tokens (light only, by owner decision) */
  --canvas: #F6F8F7; --surface: #FFFFFF; --surface-2: #EEF3F0; --line: #D3DDD7; --line-strong: #7A8B82;
  --ink: #0F1F17; --muted: #4A5D53; --subtle: #5A6A62; --primary: #066B4A; --on-primary: #FFFFFF;
  --gold: #755C00; --danger: #B80F2A; --warn: #A63D00; --info: #1A5BC7;
  /* W1-01 subtle family (proposed tokens) */
  --primary-subtle: #E7F3ED; --warn-subtle: #FDF0E7; --danger-subtle: #FCECEF; --gold-subtle: #F8F2DD;
  --mask: #000000;
  /* derived only from the tokens above */
  --page: var(--surface-2);
  --focus: var(--info);
  --hover: var(--surface-2);
  --press: color-mix(in srgb, var(--ink) 7%, transparent);
  --warn-edge: color-mix(in srgb, var(--warn) 28%, var(--surface));
  --dot-n: color-mix(in srgb, var(--ink) 72%, var(--canvas));
  --pri-hover: color-mix(in srgb, var(--primary) 84%, var(--ink));
  --shade-1: color-mix(in srgb, var(--ink) 6%, transparent);
  --shade-2: color-mix(in srgb, var(--ink) 20%, transparent);
  --shade-3: color-mix(in srgb, var(--ink) 28%, transparent);
  --shade-ring: color-mix(in srgb, var(--ink) 8%, transparent);
  --scrim: color-mix(in srgb, var(--ink) 40%, transparent);
  --scrim-soft: color-mix(in srgb, var(--ink) 12%, transparent);
  --tip-bg: var(--ink); --tip-fg: var(--surface); --tip-meta: var(--line);
  --tip-kbd: color-mix(in srgb, var(--surface) 16%, var(--ink));
  --e1: 0 1px 2px var(--shade-1);
  --e2: 0 12px 28px -8px var(--shade-2), 0 0 0 1px var(--shade-ring);
  --e3: 0 24px 48px -12px var(--shade-3), 0 0 0 1px var(--shade-ring);
  /* type: Heebo only, one scale 12 / 14 / 16 / 24 / 56 */
  --font: 'Heebo', 'Heebo Fallback', 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
  /* nav metrics */
  --nav-w: 248px; --rail-w: 64px; --row: 32px; --tile: 48px; --tile-gap: 4px;
  --ease: cubic-bezier(.2, 0, 0, 1); --t-in: 200ms; --t-out: 160ms; --t-hover: 80ms;
}
@media (max-height: 799.98px) and (min-width: 1024px) { :root { --row: 28px; --tile: 44px; --tile-gap: 2px; } }

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
body { background: var(--page); color: var(--ink); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
.rm { font: 400 14px/20px var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  padding-block: 16px;
  display: flex; flex-direction: column; gap: 12px; min-height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
/* Resets sit at zero specificity (:where) so every component class wins over them. */
:where(.rm) :where(button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: start; }
:where(.rm) :where(a) { color: inherit; text-decoration: none; }
:where(.rm) :where(ul, ol) { list-style: none; margin: 0; padding: 0; }
:where(.rm) :where(h1, h2, h3, p) { margin: 0; }
:where(.rm) :where(fieldset) { border: 0; margin: 0; padding: 0; min-width: 0; }
:where(.rm) :where(kbd) { font: 500 12px/16px var(--font); }
.rm svg.i { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: calc(var(--sw, 1.75) / var(--k, 1)); stroke-linecap: round; stroke-linejoin: round; }
.rm .i16 { --sw: 2; }
.rm .mir svg { transform: scaleX(-1); }
.rm[dir=ltr] .mir svg { transform: none; }
.num, .bdg, .amt, .k { font-variant-numeric: tabular-nums lining-nums; }
.sr { position: absolute !important; width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important;
  overflow: hidden !important; clip: rect(0 0 0 0) !important; white-space: nowrap !important; border: 0 !important; }
.rm :focus { outline: none; }
.rm :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.id { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.nw { white-space: nowrap; }
/* Skip link: fully off-canvas and shadow-free until focused (the ghost shadow of proto 1 is gone). */
.skip { position: fixed; top: -200px; inset-inline-start: 16px; z-index: 100; height: 36px; display: inline-flex; align-items: center;
  padding-inline: 12px; border-radius: 6px; background: var(--surface); color: var(--ink); font-weight: 600; }
.skip:focus-visible { top: calc(12px + env(safe-area-inset-top, 0px)); box-shadow: var(--e2); }

/* ───────── Presenter deck (outside the app) ───────── */
.deck { flex: none; display: flex; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; }
.deck-main { flex: 1 1 520px; min-width: 0; display: grid; gap: 6px; }
.deck-t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 700 16px/24px var(--font); color: var(--ink); }
.deck-t .mark { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); font: 700 12px/1 var(--font); }
.deck-t .ver { white-space: nowrap; font: 500 12px/16px var(--font); color: var(--muted); padding: 2px 8px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-strong); }
.deck-lede { color: var(--muted); max-width: 72ch; text-wrap: pretty; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; color: var(--muted); font: 400 12px/16px var(--font); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend .ldot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-n); }
.legend .ldot.d { background: var(--danger); }
.deck-ctl { flex: none; display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; max-width: 100%; min-width: 0; }
.seg { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.seg .seg-l { padding-inline: 8px 4px; font: 600 12px/16px var(--font); color: var(--muted); white-space: nowrap; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg label { height: 30px; display: inline-flex; align-items: center; padding-inline: 10px; border-radius: 7px; font: 500 12px/16px var(--font);
  color: var(--muted); cursor: pointer; white-space: nowrap; transition: background-color var(--t-hover); }
.seg label:hover { background: var(--surface-2); color: var(--ink); }
.seg input:checked + label { background: var(--ink); color: var(--surface); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }
.seg input:disabled + label { color: var(--line-strong); cursor: not-allowed; background: none; } /* disabled: exempt from 1.4.3, but it must look unavailable */
.seg input:disabled:checked + label { background: var(--surface-2); color: var(--ink); }

/* ───────── Stage: the app window ───────── */
.stage { position: relative; flex: 1 1 auto; min-height: 0; background: var(--canvas); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--e1); }
.app { --sbw: var(--nav-w); --dockw: var(--nav-w); }
.app.w-rail { --sbw: var(--rail-w); --dockw: var(--rail-w); }
.app.ovl { --sbw: var(--nav-w); --dockw: var(--rail-w); }
@media (min-width: 1024px) {
  .rm { height: 100svh; }
  .stage { min-height: 560px; }
  .app { position: absolute; inset: 0; }
  .sb { position: absolute; inset-block: 0; inset-inline-start: 0; z-index: 30; width: var(--sbw); }
  .main-col { position: absolute; inset-block: 0; inset-inline-end: 0; inset-inline-start: var(--dockw); overflow-y: auto; overflow-x: hidden;
    scroll-padding-top: 72px; scroll-padding-bottom: 24px; transition: inset-inline-start var(--t-out) var(--ease); }
  .app:not(.w-rail) .main-col { transition-duration: var(--t-in); }
  .scrim { position: absolute; inset: 0; z-index: 25; background: var(--scrim-soft); }
}

/* ───────── Side menu ───────── */
.sb { display: flex; flex-direction: column; background: var(--canvas); border-inline-end: 1px solid var(--line); overflow: hidden;
  transition: width var(--t-out) var(--ease), box-shadow var(--t-out) var(--ease); }
.app:not(.w-rail) .sb { transition-duration: var(--t-in); }
.app.ovl .sb { box-shadow: var(--e3); border-inline-end-color: transparent; }
.sb-edge { position: absolute; inset-block: 0; inset-inline-end: 0; width: 6px; cursor: col-resize; z-index: 2; }
.sb-edge::after { content: ''; position: absolute; inset-block: 0; inset-inline-end: 0; width: 2px; background: var(--line-strong); opacity: 0; transition: opacity var(--t-hover); }
.sb-edge:hover::after { opacity: 1; }
.app.field .sb-edge { display: none; }

/* Head 56: the hairline continues the top bar's. ⇅ sits inside the switcher pill, right after the name. */
.sb-head { flex: none; height: 56px; display: flex; align-items: center; border-bottom: 1px solid var(--line); position: relative; }
.sw { display: inline-flex; align-items: center; gap: 8px; height: 40px; max-width: calc(100% - 24px); margin-inline: 12px; padding-inline: 8px 10px;
  border-radius: 8px; transition: background-color var(--t-hover); }
button.sw:hover, button.sw[aria-expanded=true] { background: var(--hover); }
button.sw:active { background: var(--press); }
.mono { flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); font: 700 12px/1 var(--font); }
.sw-t { min-width: 0; display: flex; flex-direction: column; }
.sw-n { font: 600 14px/18px var(--font); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-s { font: 400 12px/16px var(--font); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw .chev { flex: none; color: var(--muted); }

/* ⌘K field: search glyph on the icon axis, label on the label axis, kbd chip on the badge axis. */
.sb-tools { flex: none; padding: 8px 12px; }
.search { width: 100%; height: var(--row); display: flex; align-items: center; gap: 8px; padding-inline: 8px; border-radius: 8px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--e1); color: var(--muted); white-space: nowrap; overflow: hidden;
  transition: box-shadow var(--t-hover), background-color var(--t-hover); --ring: var(--surface); }
.search:hover { box-shadow: inset 0 0 0 1px var(--line-strong), var(--e1); color: var(--ink); }
.search:active { background: var(--surface-2); }
.search:focus-visible { outline-offset: -2px; }
.search .ic { width: 24px; height: 24px; display: grid; place-items: center; flex: none; }
.search .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.search .rl { display: none; }
.k { display: inline-flex; align-items: center; height: 20px; padding-inline: 5px; border-radius: 4px; background: var(--surface-2); color: var(--muted);
  font: 500 12px/16px var(--font); white-space: nowrap; box-shadow: inset 0 -1px 0 var(--line); }

/* Nav body */
.sb-nav { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.sb-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-block: 4px 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.sb-scroll.fade-b { -webkit-mask-image: linear-gradient(to top, transparent 0, var(--mask) 28px); mask-image: linear-gradient(to top, transparent 0, var(--mask) 28px); }
.sb-scroll.fade-t { -webkit-mask-image: linear-gradient(to bottom, transparent 0, var(--mask) 28px); mask-image: linear-gradient(to bottom, transparent 0, var(--mask) 28px); }
.sb-scroll.fade-t.fade-b { -webkit-mask-image: linear-gradient(to bottom, transparent 0, var(--mask) 28px, var(--mask) calc(100% - 28px), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, var(--mask) 28px, var(--mask) calc(100% - 28px), transparent 100%); }
.sb-foot { flex: none; padding-block: 8px 4px; border-top: 1px solid var(--line); }

/* Row 32: icon box 24 at x 20–44 (glyph 20, centre 32); label at 52; badge ends at 227. */
.row { position: relative; height: var(--row); margin-inline: 12px; padding-inline: 8px; display: flex; align-items: center; gap: 8px;
  border-radius: 6px; color: var(--muted); font: 500 14px/20px var(--font); white-space: nowrap; --ring: var(--canvas);
  transition: background-color var(--t-hover), color var(--t-hover); }
.row .ic { position: relative; flex: none; width: 24px; height: 24px; display: grid; place-items: center; }
.row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row .rl { display: none; }
.row:hover { background: var(--hover); color: var(--ink); --ring: var(--hover); }
.row:active { background: var(--press); }
.row:focus-visible { outline-offset: -2px; }
.row[aria-current=page] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line), var(--e1); --ring: var(--surface); }
.row[aria-current=page] .ic { color: var(--primary); --sw: 2; }
.row[aria-current=page]::before, .notch::before { content: ''; position: absolute; inset-inline-start: 0; top: 8px; bottom: 8px; width: 2px;
  border-start-end-radius: 2px; border-end-end-radius: 2px; background: var(--primary); }
.rm[dir=ltr] .row[aria-current=page]::before { border-radius: 0 2px 2px 0; }

/* Badges: ₪ T2 is the only colour; counts are grey; one value per pill. */
.bdg { flex: none; height: 20px; min-width: 20px; padding-inline: 6px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  font: 600 12px/16px var(--font); font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.b-n { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.row:hover .b-n { background: var(--surface); }
.b-n .bd { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); }
.b-w { background: var(--warn-subtle); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-edge); }
.b-ils { background: var(--warn-subtle); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-edge); }
.b-ils.b-block { background: var(--danger); color: var(--on-primary); box-shadow: none; }
.ro { flex: none; width: 20px; height: 20px; display: grid; place-items: center; color: var(--subtle); }
/* One dot rule (rail tiles, bell, phone bar): 8 px, 2 px cut-out ring in the surface behind it, outside the glyph at top inline-end. */
.dot { display: none; position: absolute; top: -3px; inset-inline-end: -3px; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--ring, var(--canvas)); }
.dot[data-dot=danger] { background: var(--danger); }
.dot[data-dot=warn] { background: var(--warn); }
.dot[data-dot=n] { background: var(--dot-n); }

.sep { height: 8px; }
/* Group header: a 32 px row on the same grid. Glyph 16 on the icon axis, label 12/600 on the label axis, T2 dot on the badge axis. */
.grp { position: relative; }
.grp.open, .grp.open + .grp, .flat + .grp, .grp.open + .flat { margin-top: 8px; }
.grp-h { position: relative; width: calc(100% - 24px); height: var(--row); margin-inline: 12px; padding-inline: 8px; display: flex; align-items: center; gap: 8px;
  border-radius: 6px; color: var(--muted); font: 600 12px/16px var(--font); white-space: nowrap; --ring: var(--canvas);
  transition: color var(--t-hover), background-color var(--t-hover); }
.grp-h:hover { background: var(--hover); color: var(--ink); --ring: var(--hover); }
.grp-h:active { background: var(--press); }
.grp-h:focus-visible { outline-offset: -2px; }
.grp-h .gic { position: relative; flex: none; width: 24px; height: 24px; display: grid; place-items: center; --sw: 2; }
.grp-h .gic svg { width: 16px; height: 16px; }
.grp-h .rl { display: none; }
.grp-h .chev { flex: none; color: var(--subtle); margin-inline-start: -4px; transition: transform 120ms var(--ease); }
.grp-h[aria-expanded=false] .chev { transform: rotate(90deg); }
.rm[dir=ltr] .grp-h[aria-expanded=false] .chev { transform: rotate(-90deg); }
.grp-h .gdot { display: none; margin-inline-start: auto; margin-inline-end: 0; width: 6px; height: 6px; border-radius: 50%; }
.grp:not(.open) .grp-h .gdot[data-dot] { display: block; }
.gdot[data-dot=danger] { background: var(--danger); }
.gdot[data-dot=warn] { background: var(--warn); }
.grp.has-cur:not(.open) .grp-h { color: var(--ink); }
.grp.has-cur:not(.open) .grp-h .gic { color: var(--primary); }
.gx { display: none; }
.grp.open .gx { display: block; }
.gx ul { padding-top: 0; }
.gx-t { display: none; }

/* Help row: icons + 12 px labels, the same place on every screen (WCAG 3.2.6). */
.grp.help { margin-top: 4px; }
.grp.help .grp-h { display: none; }
.grp.help .gx { display: block; }
.grp.help ul { display: flex; align-items: center; gap: 2px; margin-inline: 12px; padding-inline: 4px 0; height: 32px; }
.sl { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding-inline: 4px 8px; border-radius: 6px; color: var(--muted);
  font: 400 12px/16px var(--font); white-space: nowrap; transition: color var(--t-hover), background-color var(--t-hover); }
.sl:hover { color: var(--ink); background: var(--hover); }
.sl .ic { width: 24px; height: 24px; display: grid; place-items: center; flex: none; margin-inline-start: 0; }
.sl:focus-visible { outline-offset: -2px; }

/* User row: avatar on the icon axis, the collapse toggle shares the row. */
.sb-user { flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-top: 1px solid var(--line); }
.me { flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding-inline: 8px; border-radius: 8px; transition: background-color var(--t-hover); --ring: var(--canvas); }
.me:hover, .me[aria-expanded=true] { background: var(--hover); }
.me:active { background: var(--press); }
.av { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink);
  font: 600 12px/1 var(--font); box-shadow: inset 0 0 0 1px var(--line); }
.me-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.me-n { font: 600 14px/18px var(--font); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-r { font: 400 12px/16px var(--font); color: var(--muted); white-space: nowrap; }
.iconbtn { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); position: relative;
  transition: background-color var(--t-hover), color var(--t-hover); --ring: var(--canvas); }
.iconbtn:hover { background: var(--hover); color: var(--ink); --ring: var(--hover); }
.iconbtn:active { background: var(--press); }
.iconbtn[aria-haspopup][aria-expanded=true] { background: var(--hover); color: var(--ink); --ring: var(--hover); }
.gl { position: relative; display: grid; place-items: center; }
.gl .dot { display: block; }

/* ───────── Rail (64): same icon axis (x 32); every tile carries a 12 px label ───────── */
.rail .sb-head { justify-content: flex-start; }
.rail .sw { width: 40px; padding-inline: 8px; }
.rail .sw .sw-t, .rail .sw .chev { display: none; }
.rail .sb-tools { padding: 4px; }
.rail .search, .rail .tiles .row, .rail .grp-h { width: 56px; height: var(--tile); margin-inline: 4px; padding: 5px 0 0; flex-direction: column; align-items: center;
  justify-content: flex-start; gap: 2px; border-radius: 10px; background: transparent; box-shadow: none; }
.rail .search { margin-inline: 0; }
.rail .search:hover, .rail .tiles .row:hover, .rail .grp-h:hover { background: var(--hover); }
.rail .search .lbl, .rail .search .k, .rail .tiles .row .lbl, .rail .tiles .bdg, .rail .tiles .ro, .rail .grp-h .lbl, .rail .grp-h .chev, .rail .grp-h .gdot {
  position: absolute !important; width: 1px !important; height: 1px !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; white-space: nowrap !important; }
.rail .tiles .bdg, .rail .tiles .ro, .rail .grp-h .chev, .rail .grp-h .gdot, .rail .search .k { display: none !important; }
.rail .rl, .rail .search .rl, .rail .grp-h .rl, .rail .tiles .row .rl { display: block; max-width: 54px; overflow: hidden; white-space: nowrap; text-align: center;
  font: 500 12px/16px var(--font); color: inherit; }
.rail .tiles .row[aria-current=page] .rl, .rail .grp.has-cur .grp-h .rl { font-weight: 600; }
.rail .grp-h .gic { --sw: 1.75; }
.rail .grp-h .gic svg { width: 20px; height: 20px; }
.rail .dot[data-dot] { display: block; }
.rail .tiles li + li, .rail .grp + .grp, .rail .tiles + .grp, .rail .grp + .tiles { margin-top: var(--tile-gap); }
.rail .grp, .rail .grp.open, .rail .flat + .grp, .rail .grp.open + .flat { margin-top: var(--tile-gap); }
.rail .sep { height: 9px; position: relative; }
.rail .sep::after { content: ''; position: absolute; top: 4px; inset-inline-start: 20px; width: 24px; height: 1px; background: var(--line); }

.rail .tiles .row[aria-current=page]::before, .rail .grp.has-cur .grp-h::before { content: ''; position: absolute; inset-inline-start: 0; top: 12px; height: 20px; bottom: auto; width: 2px;
  border-start-end-radius: 2px; border-end-end-radius: 2px; background: var(--primary); }
.rail .grp-h[aria-expanded=true] { background: var(--hover); color: var(--ink); --ring: var(--hover); }

/* Flyout: 240 px, white, 8 px off the rail, 16/700 ink title as the anchor, pin action at the end. */
.rail .grp.fly .gx { display: block; position: fixed; z-index: 60; width: 240px; background: var(--surface); border-radius: 12px; box-shadow: var(--e2); padding: 4px 0 6px; }

/* Collapse/expand choreography (one DOM, two layouts). Icons glide with FLIP; labels only fade. */
.app.fading .sb :is(.row .lbl, .bdg, .ro, .sw-t, .sw .chev, .search .lbl, .search .k, .me-t, .grp-h .lbl, .grp-h .chev, .gdot, .help ul, .gx) { opacity: 0; transition: opacity 80ms linear; }
.app.fading-rail .sb .rl { opacity: 0; transition: opacity 80ms linear; }
.app.rail-in .sb .rl { animation: rmFade 140ms 30ms both; }
.app.reveal .sb :is(.row .lbl, .bdg, .ro, .sw-t, .sw .chev, .search .lbl, .search .k, .me-t, .grp-h .lbl, .grp-h .chev, .help ul, .gx) { animation: rmFade 140ms 130ms both; }
@keyframes rmFade { from { opacity: 0; } to { opacity: 1; } }

/* ───────── Top bar + page ───────── */

/* T1 hero: the leak is the loudest thing on the screen, never in the chrome. */

/* לטיפולי card + queue page */

.tile { padding: 16px 20px; }

.note { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: var(--canvas); color: var(--muted); font: 400 12px/16px var(--font); }

.qi { display: grid; grid-template-columns: 112px minmax(0, 1fr) 112px 304px; align-items: center; gap: 16px; padding: 12px 12px; margin-inline: -12px; border-radius: 8px; border-top: 1px solid var(--line); }
.qi:first-child { border-top-color: transparent; }

.ck { width: 28px; height: 28px; display: grid; place-items: center; }

  font: 400 14px/20px var(--font); white-space: nowrap; }

.br { min-height: 52px; }
.br .t b { display: block; font: 500 14px/20px var(--font); }
.br .t span { display: flex; align-items: center; gap: 6px; font: 400 12px/16px var(--font); color: var(--muted); }
.br .t span i { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); }
.br .lk { margin-inline-start: auto; text-align: end; min-width: 64px; }
.br .lk b { display: block; font: 600 14px/20px var(--font); font-variant-numeric: tabular-nums; }
.br .lk span { display: block; font: 400 12px/16px var(--font); color: var(--muted); font-variant-numeric: tabular-nums; }
.me-h { padding: 10px 12px 8px; }
.me-h b { display: block; font: 600 14px/20px var(--font); }
.me-h span { font: 400 12px/16px var(--font); color: var(--muted); }
.bellp { width: 384px; max-width: calc(100vw - 16px); padding: 0; }

.bellp .bell-h button { margin-inline-start: auto; font: 500 12px/16px var(--font); color: var(--primary); padding: 4px 6px; border-radius: 4px; }
.al-l { padding: 4px 8px; }
.al { display: flex; gap: 10px; padding: 10px 8px; border-radius: 8px; align-items: flex-start; }
a.al:hover { background: var(--canvas); }
a.al:focus-visible { outline-offset: -2px; }
.al-l li + li .al { border-top: 1px solid var(--line); border-radius: 0; }

.al-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.al-h { font: 500 14px/20px var(--font); color: var(--ink); }

.al-s { font: 400 12px/16px var(--font); color: var(--muted); }
.al-ch { flex: none; align-self: center; font: 500 12px/16px var(--font); color: var(--muted); padding: 1px 6px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }

.quiet { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); font: 400 12px/16px var(--font); color: var(--muted); }
.bellp .foot { padding: 4px; border-top: 1px solid var(--line); }
.tip { position: fixed; z-index: 70; max-width: 280px; display: grid; gap: 2px; padding: 8px 10px; border-radius: 8px; background: var(--tip-bg); color: var(--tip-fg);
  box-shadow: var(--e2); opacity: 0; transition: opacity 90ms; pointer-events: auto; }

.tip .tm { font: 400 12px/16px var(--font); color: var(--tip-meta); }
.toast { position: fixed; z-index: 90; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 8px;
  background: var(--ink); color: var(--surface); box-shadow: var(--e2); font: 500 14px/20px var(--font); opacity: 0; pointer-events: none; transition: opacity 150ms; max-width: calc(100vw - 32px); }

:where(.rm) :where(dialog) { border: 0; padding: 0; color: var(--ink); background: var(--surface); font: 400 14px/20px var(--font); }

  let html = '<div class="grab" aria-hidden="true"></div><h2 id="moreT">עוד<button type="button" class="iconbtn" data-act="closeMore" aria-label="סגירה">' + svg('x', 20) + '</button></h2>';
  html += '<ul><li><button type="button" class="row" data-act="palette" style="width:calc(100% - 16px)"><span class="ic">' + svg('search', 20) + '</span><span class="lbl">' + r.ph + '</span></button></li></ul>';
  const sec = (title, keys) => { keys = keys.filter((k) => !inBar.includes(k)); if (!keys.length) return ''; return (title ? '<p class="sh-g">' + title + '</p>' : '') + '<ul>' + keys.map((k) => rowHTML(k)).join('') + '</ul>'; };
  if (r.field) html += sec('', r.items.concat(['settings']));
  else { html += sec('', r.top); r.nav.forEach(([g, items]) => { html += sec(GR[g].t, items); }); html += sec(GR.admin.t, r.admin); }
  html += '<p class="sh-g">עזרה וחשבון</p><div class="sl-row">' + ['help', 'a11y', 'contact'].map((k) => '<a class="sl" href="#' + k + '" data-k="' + k + '">' + (IT[k].full || IT[k].t) + '</a>').join('') +
    '<button type="button" class="sl" data-act="logout">התנתקות</button></div>';
  $('#more').innerHTML = html;
  $('#more').showModal();
}
$('#more').addEventListener('click', (e) => {
  if (e.target === $('#more') || e.target.closest('[data-act=closeMore]')) $('#more').close();
  else if (e.target.closest('[data-act=palette]')) { $('#more').close(); openPal(); }
  else if (e.target.closest('[data-k]')) $('#more').close();
});

/* ───────── Branch switch keeps the page ───────── */
function switchScope(v) {
  const k = knownKey(MEM, v); if (!k) return;
  S.scope = k; closePop();
  renderSidebar(); renderTop(); renderPage(); renderBar();
  document.title = (IT[S.active].full || IT[S.active].t) + ' · ' + MEM[k].t + ' — RestoMatch';
  toast('עברת ל' + MEM[k].t + ' · נשארת ב' + (IT[S.active] || IT.home).t);
  const b = phone() ? $('#mSw') : (isRail() ? $('#swBtn') : $('#swBtn')); if (b) b.focus();
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }

/* ───────── Clicks ───────── */
ROOT.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('#skipLink')) { e.preventDefault(); $('#main').focus({ preventScroll: false }); $('#main').scrollIntoView({ block: 'start' }); return; }
  const pin = t.closest('[data-pin]');
  if (pin) {
    const g = pin.dataset.pin; closeAllFly(); S.groups[g] = true; S.lru[g] = Date.now(); LS.set('rm:nav:groups:' + S.role, JSON.stringify(S.groups));
    if (narrow()) { S.ovl = true; } else { S.railPref = false; LS.set('rm:nav:rail', '0'); }
    renderSidebar(); applyMode(true);
    setTimeout(() => { const h = $('#gh-' + g); if (h) { h.scrollIntoView({ block: 'nearest' }); h.focus(); } fitGroups(g); }, 260);
    return;
  }
  const gh = t.closest('#sb .grp-h');
  if (gh) {
    const grp = gh.closest('.grp');
    if (isRail()) { if (grp.classList.contains('fly')) closeFly(grp); else openFly(grp, e.detail === 0); }
    else { const open = !grp.classList.contains('open'); setGroup(grp.dataset.g, open); if (open) fitGroups(grp.dataset.g); updateFades(); }
    return;
  }
  const fav = t.closest('[data-favtoggle]');
  if (fav) {
    const k = fav.dataset.favtoggle;
    if (S.fav.includes(k)) S.fav = S.fav.filter((x) => x !== k);
    else if (S.fav.length >= 5) { toast('אפשר להצמיד עד 5 מסכים'); return; }
    else { S.fav = [...S.fav, k]; S.groups.fav = true; }
    LS.set('rm:nav:fav:' + S.role, JSON.stringify(S.fav));
    renderSidebar(); renderPage(); fitGroups('fav');
    const nb = $('[data-favtoggle="' + k + '"]'); if (nb) nb.focus();
    toast(S.fav.includes(k) ? IT[k].t + ' נוסף למועדפים' : IT[k].t + ' הוסר מהמועדפים');
    return;
  }
  if (t.closest('#swBtn')) { const a = t.closest('#swBtn'); if (pop && pop.el.id === 'swPop') closePop(); else { swMenu($('#swPop')); openPop($('#swPop'), a, isRail() ? 'sb' : 'below', e.detail === 0 ? 'checked' : null); } return; }
  if (t.closest('#mSw')) { const a = t.closest('#mSw'); if (pop && pop.el.id === 'mSwPop') closePop(); else { swMenu($('#mSwPop')); openPop($('#mSwPop'), a, 'below', e.detail === 0 ? 'checked' : null); } return; }
  if (t.closest('#meBtn')) {
    const a = t.closest('#meBtn');
    if (pop && pop.el.id === 'mePop') closePop();
    else { meMenu(); $('#mePop').style.width = isRail() ? '256px' : ($('#sbUser').clientWidth - 24) + 'px'; openPop($('#mePop'), a, isRail() ? 'sb' : 'above', e.detail === 0 ? 'first' : null); }
    return;
  }
  const bb = t.closest('.bellbtn');
  if (bb) {
    const el = bb.id === 'mBell' ? $('#mBellPop') : $('#bellPop');
    if (pop && pop.el === el) closePop(); else { bellPanel(el, bb.id === 'mBell' ? 'bellT2' : 'bellT'); openPop(el, bb, 'below-end', 'self'); }
    return;
  }
  if (t.closest('#searchBtn') || t.closest('#mSearch')) { openPal(); return; }
  if (t.closest('#railBtn') || t.closest('#sbEdge')) { toggleRail(); return; }
  if (t.closest('#moreBtn')) { openMore(); return; }
  if (t.closest('#scrim')) { closeOverlay(true); return; }
  const sc = t.closest('[data-scope]');
  if (sc) { switchScope(sc.dataset.scope); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'keys') openKeys();
    if (a === 'keys1') { setKeys1(!S.keys1); if (pop && pop.el.id === 'mePop') { meMenu(); const f = $('[data-act=keys1]', $('#mePop')); if (f) f.focus(); } }
    if (a === 'logout') { closePop(); if ($('#more').open) $('#more').close(); toast('התנתקות · באב־הטיפוס אין חשבון אמיתי'); }
    if (a === 'read') { S.bellUnread = false; closePop(); renderTop(); const b = $('#bellBtn'); if (b && !phone()) b.focus(); toast('ההתראות סומנו כנקראו'); }
    if (a === 'capture') toast('צילום חשבונית נפתח במצלמה בטלפון');
    if (a === 'bulk') { S.confirm = true; renderPage(); const y = $('[data-act=bulkYes]'); if (y) y.focus(); }
    if (a === 'bulkNo') { S.confirm = false; renderPage(); const b = $('[data-act=bulk]'); if (b) b.focus(); }
    if (a === 'bulkYes') {
      const ids = $$('[data-bulk]').filter((x) => x.checked).map((x) => x.dataset.bulk);
      const v = sum(GAPS.filter((g) => ids.includes(g.id)).map((g) => g.v));
      ids.forEach((id) => S.approved.add(id)); S.confirm = false;
      renderSidebar(); renderBar(); renderTop(); renderPage();
      const h = $('#pageH1'); if (h) h.focus();
      toast('אושרו ' + N.format(ids.length) + ' פערים קטנים · ' + ilsT(v, 2) + ' · הדמיה, לא נשלח לשרת');
    }
    return;
  }
  const lang = t.closest('[data-lang]');
  if (lang) { closePop(true); if (lang.dataset.lang === 'en') toast('English: לא כלול באב־הטיפוס הזה'); return; }
  const link = t.closest('a[data-k]');
  if (link) { e.preventDefault(); if (pop) closePop(); closeAllFly(); go(link.dataset.k); return; }
});
ROOT.addEventListener('change', (e) => {
  const t = e.target;
  if (t.name === 'rp') { setRole(t.value); return; }
  if (t.name === 'navmode') { const wantRail = t.value === 'rail'; if (wantRail !== isRail()) toggleRail(); return; }
  if (t.name === 'qscope') { S.qScope = t.value === 'all' ? 'all' : 'mine'; S.qSel = 0; renderPage(); const f = $('#qs-' + S.qScope); if (f) f.focus(); return; }
  if (t.matches('[data-bulk]')) {
    const ids = $$('[data-bulk]').filter((x) => x.checked).map((x) => x.dataset.bulk);
    const v = sum(GAPS.filter((g) => ids.includes(g.id)).map((g) => g.v));
    const b = $('#bulkBar .bulk-t b'); if (b) b.innerHTML = N.format(ids.length) + ' פערים קטנים נבחרו · <bdi>' + ils(v, 2) + '</bdi>';
    const btn = $('[data-act=bulk]'); if (btn) { btn.textContent = 'אישור מרוכז (' + N.format(ids.length) + ')'; btn.disabled = !ids.length; }
  }
});
$('#sbScroll').addEventListener('scroll', updateFades, { passive: true });

/* ───────── Keyboard (bound on KeyboardEvent.code, so the Hebrew layout works) ───────── */
const OPEN_KEY = RTL ? 'ArrowLeft' : 'ArrowRight', CLOSE_KEY = RTL ? 'ArrowRight' : 'ArrowLeft';
const editable = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) && !(el.type === 'radio' || el.type === 'checkbox');
function navStops() {
  return $$('#sb .row, #sb .grp-h, #sb .sl').filter((el) => el.offsetParent !== null && !(isRail() && el.closest('.gx')) && !(el.closest('.gx') && !el.closest('.grp.open, .grp.help')) && getComputedStyle(el).display !== 'none');
}
let gPending = false, gT = 0;
document.addEventListener('keydown', (e) => {
  const ae = document.activeElement;
  if (e.key === 'Escape') {
    if (!tip.hidden) hideTip(true);
    const fly = $('#sb .grp.fly');
    if (fly) { e.preventDefault(); closeFly(fly, true); return; }
    if (pop) { e.preventDefault(); closePop(true); return; }
    if (S.ovl) { e.preventDefault(); closeOverlay(true); return; }
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.code === 'KeyB' && !e.repeat && !e.altKey && !e.shiftKey) {
    if (editable(ae) || ROOT.querySelector('dialog[open]')) return;
    e.preventDefault(); closePop(); toggleRail(true); return;
  }
  if (mod && e.code === 'KeyK' && !e.repeat) { e.preventDefault(); if (pal.open) pal.close(); else openPal(); return; }
  /* overlay (1024–1279) is modal: Tab and Shift+Tab wrap inside the panel */
  if (S.ovl && e.key === 'Tab' && !pop && ae && ae.closest('#sb')) {
    const list = $$('#sb a[href], #sb button:not([disabled]), #sb [tabindex]:not([tabindex="-1"])').filter((x) => x.offsetParent !== null && !x.closest('.pop[hidden]'));
    const i = list.indexOf(ae);
    if (!e.shiftKey && i === list.length - 1) { e.preventDefault(); list[0].focus(); return; }
    if (e.shiftKey && i === 0) { e.preventDefault(); list[list.length - 1].focus(); return; }
  }
  /* popovers: Tab out closes and continues from the trigger */
  if (pop && e.key === 'Tab' && pop.el.contains(ae)) {
    if (pop.el.getAttribute('role') === 'menu') { e.preventDefault(); const a = pop.anchor; closePop(); focusBeside(a, e.shiftKey ? 0 : 1); if (e.shiftKey) a.focus(); return; }
    const f = $$('a[href], button:not([disabled])', pop.el).filter((x) => x.offsetParent !== null);
    if (!e.shiftKey && ae === f[f.length - 1]) { e.preventDefault(); const a = pop.anchor; closePop(); focusBeside(a, 1); return; }
    if (e.shiftKey && (ae === f[0] || ae === pop.el)) { e.preventDefault(); closePop(true); return; }
  }
  if (pop && pop.el.contains(ae) && /^(ArrowDown|ArrowUp|Home|End)$/.test(e.key)) {
    const items = $$('[role^=menuitem], a.al, .foot a.mi', pop.el).filter((x) => x.offsetParent !== null), i = items.indexOf(ae);
    if (items.length) {
      e.preventDefault();
      const n = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[n].focus();
    }
    return;
  }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && ae && (ae.id === 'swBtn' || ae.id === 'meBtn')) {
    e.preventDefault(); ae.click();
    const it = pop && $$('[role^=menuitem]', pop.el); if (it && it.length) (e.key === 'ArrowUp' ? it[it.length - 1] : ($('[aria-checked=true].br', pop.el) || it[0])).focus();
    return;
  }
  if (editable(ae) || ROOT.querySelector('dialog[open]')) return;
  const single = !mod && !e.altKey && S.keys1;
  /* A pending G chord wins: on the Hebrew layout KeyQ types "/", and G Q must still open לטיפולי. */
  if (gPending && single) {
    gPending = false; clearTimeout(gT);
    const letter = e.code.replace(/^Key/, '');
    const k = visibleKeys().find((x) => IT[x].g === letter);
    if (k) { e.preventDefault(); go(k); return; }
  }
  if (single && e.key === '?') { e.preventDefault(); openKeys(); return; }
  if (single && !e.shiftKey && (e.code === 'Slash' || (e.key === '/' && !/^Key[A-Z]$/.test(e.code)))) { e.preventDefault(); openPal(); return; }
  if (single && e.code === 'BracketLeft' && !e.repeat) { e.preventDefault(); toggleRail(); return; }
  if (single && !e.shiftKey && e.code === 'KeyG') { gPending = true; clearTimeout(gT); gT = setTimeout(() => (gPending = false), 1000); return; }
  /* לטיפולי: J / K */
  if (S.active === 'queue' && single && (e.code === 'KeyJ' || e.code === 'KeyK') && !(ae && ae.closest('#sb'))) {
    const rows = $$('.qi'); if (!rows.length) return;
    e.preventDefault();
    S.qSel = Math.max(0, Math.min(rows.length - 1, S.qSel + (e.code === 'KeyJ' ? 1 : -1)));
    rows.forEach((r, i) => { r.tabIndex = i === S.qSel ? 0 : -1; if (i === S.qSel) r.setAttribute('aria-current', 'true'); else r.removeAttribute('aria-current'); });
    rows[S.qSel].focus(); return;
  }
  if (ae && ae.classList && ae.classList.contains('qi') && e.key === 'Enter') { const a = $('.qi-a a', ae); if (a) a.click(); return; }
  /* Arrow keys in the side menu (RTL: ← opens / enters, → closes / returns) */
  if (!ae || !ae.closest('#sb')) return;
  const fly = ae.closest('.grp.fly');
  if (fly && isRail()) {
    const links = $$('.gx a, .gx-t button', fly).filter((x) => x.offsetParent !== null), i = links.indexOf(ae);
    if (e.key === 'ArrowDown') { e.preventDefault(); links[(i + 1) % links.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); links[(i - 1 + links.length) % links.length].focus(); }
    else if (e.key === CLOSE_KEY) { e.preventDefault(); closeFly(fly, true); }
    else if (e.key === 'Home') { e.preventDefault(); links[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); links[links.length - 1].focus(); }
    return;
  }
  const stops = navStops(), i = stops.indexOf(ae);
  if (i < 0) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); stops[Math.min(i + 1, stops.length - 1)].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); stops[Math.max(i - 1, 0)].focus(); }
  else if (e.key === 'Home') { e.preventDefault(); stops[0].focus(); }
  else if (e.key === 'End') { e.preventDefault(); stops[stops.length - 1].focus(); }
  else if (e.key === OPEN_KEY || e.key === CLOSE_KEY) {
    const gh = ae.classList.contains('grp-h') ? ae : null, grp = ae.closest('.grp');
    if (isRail()) { if (gh && e.key === OPEN_KEY) { e.preventDefault(); openFly(grp, true); } return; }
    if (gh && grp.dataset.g !== 'help') {
      e.preventDefault();
      const open = grp.classList.contains('open');
      if (e.key === OPEN_KEY) { if (!open) { setGroup(grp.dataset.g, true); fitGroups(grp.dataset.g); } else { const f = $('.gx ul a', grp); if (f) f.focus(); } }
      else if (open) setGroup(grp.dataset.g, false);
      updateFades();
    } else if (grp && e.key === CLOSE_KEY && grp.dataset.g !== 'help') { e.preventDefault(); $('.grp-h', grp).focus(); }
  } else if ((e.key === ' ' || e.key === 'Spacebar') && ae.tagName === 'A') { e.preventDefault(); ae.click(); }
});

/* ───────── Presenter deck: role preview + legend ───────── */
function renderDeck() {
  const field = isField();
  $('#deckLede').textContent = field
    ? 'כך נראה התפריט ל' + R().label + ' במחשב: פס צר בצד ימין, רק המסכים של התפקיד, עם שם קצר מתחת לכל אייקון. בלי סכומים בכלל.'
    : phone()
      ? 'בטלפון התפריט הוא סרגל תחתון לפי התפקיד, ו״עוד״ פותח את כל השאר. במחשב הוא יושב בצד ימין, עם אייקונים, וכסף שמחכה להחלטה עומד למעלה.'
      : 'כך ייראה התפריט במחשב: בצד ימין, עם אייקונים, לפי התפקיד. כסף שמחכה להחלטה עומד למעלה, והוא הדבר היחיד שצבוע. ' + MOD + '+B מכווץ לפס צר עם שמות קצרים.';
  $('#legend').innerHTML = field
    ? '<li><span class="bdg b-n">3</span>מספר פריטים</li><li><span class="ldot"></span>נקודה: יש משהו בפנים</li><li>שף ומקבל סחורה לא רואים סכומי כסף, גם לא בחיפוש ובהתראות</li>'
    : '<li><span class="bdg b-ils b-block"><bdi>' + ils(296) + '</bdi></span>כסף שתקוע: חוסם תשלום לספק</li><li><span class="bdg b-ils"><bdi>' + ils(451) + '</bdi></span>כסף שמחכה לטיפול</li>' +
      '<li><span class="bdg b-n">10</span>מספר פריטים</li><li><span class="ldot d"></span>נקודה בפס הצר: יש כסף בפנים</li>';
  const set = $('#rpSet');
  $$('input, label', set).forEach((x) => x.remove());
  set.insertAdjacentHTML('beforeend', FIVE.map((k) => '<input type="radio" name="rp" id="rp-' + k + '" value="' + k + '"' + (S.role === k ? ' checked' : '') + '><label for="rp-' + k + '">' + ROLES[k].label + '</label>').join(''));
  syncDeckNav();
}
function setRole(v) {
  const k = knownKey(ROLES, v);
  if (!k || k === S.role) return;
  S.role = k; S.scope = 'main'; S.active = 'home'; S.bellUnread = true; S.qScope = 'mine'; S.approved = new Set(); S.recent = []; S.ovl = false;
  loadPrefs();
  LS.set('rm:proto:role', k);
  closePop(); closeAllFly(); hideTip(true);
  renderSidebar(); renderBar(); renderTop(); renderPage(); renderDeck();
  applyMode(false);
  try { history.replaceState(null, '', location.pathname + location.search + '#home'); } catch (e) { /* ignore */ }
  const f = $('#rp-' + k); if (f) f.focus();
  announce('תצוגה כ־' + ROLES[k].label);
}
function loadPrefs() {
  try { const g = JSON.parse(LS.get('rm:nav:groups:' + S.role) || '{}') || {}; S.groups = {}; Object.keys(g).forEach((k) => { if (g[k] === true) S.groups[k] = true; }); } catch (e) { S.groups = {}; }
  try { const v = visibleKeys(); S.fav = (JSON.parse(LS.get('rm:nav:fav:' + S.role) || '[]') || []).map((x) => v.find((k) => k === x)).filter(Boolean).slice(0, 5); } catch (e) { S.fav = []; }
  S.lru = {};
}

/* ───────── Boot ───────── */
(function boot() {
  const qp = new URLSearchParams(location.search);
  if (qp.get('bare') === '1') ROOT.classList.add('bare');
  if (qp.get('clean') === '1') ROOT.classList.add('clean');
  if (qp.get('reset') === '1') { try { Object.keys(window.localStorage).filter((k) => k.startsWith('rm:')).forEach((k) => window.localStorage.removeItem(k)); } catch (e) { /* ignore */ } }
  const role = qp.get('role') || LS.get('rm:proto:role') || 'owner';
  S.role = knownKey(ROLES, role) || 'owner';
  S.keys1 = LS.get('rm:keys:single') !== '0';
  S.railPref = qp.get('nav') === 'rail' ? true : qp.get('nav') === 'open' ? false : LS.get('rm:nav:rail') === '1';
  loadPrefs();
  const h = keyOfHash(location.hash.slice(1));
  S.active = visibleKeys().includes(h) ? h : 'home';
  renderSidebar(); renderBar(); renderTop(); renderPage(); renderDeck();
  applyMode(false);
  fitGroups();
  const band = () => (phone() ? 'p' : narrow() ? 'n' : 'w');
  let lastBand = band();
  addEventListener('resize', () => { closePop(); hideTip(true); closeAllFly(); if (band() !== lastBand) { lastBand = band(); S.ovl = false; applyMode(false); renderDeck(); } fitGroups(); updateFades(); });
  S.booted = true;
})();
})();
